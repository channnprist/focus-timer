<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0508" />
  <title>๒๕:๐๐ · โฟกัส</title>
  <style>
    :root {
      --bg: #140406;
      --bg-deep: #0a0203;
      --maroon: #5c1018;
      --maroon-mid: #7a1a24;
      --gold: #d4af37;
      --gold-soft: #e8c96a;
      --gold-dim: rgba(212, 175, 55, 0.22);
      --cream: #f6ead0;
      --muted: #c4a98a;
      --ring-track: rgba(212, 175, 55, 0.14);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Sukhumvit Set", "Thonburi", "Sarabun", "Noto Sans Thai", "Hiragino Sans", system-ui, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, #4a1218 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 100% 100%, #2a080c 0%, transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .shell {
      width: min(440px, 100%);
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    .ornament {
      color: var(--gold);
      letter-spacing: 0.45em;
      font-size: 11px;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1.55rem, 5vw, 1.9rem);
      letter-spacing: 0.08em;
      color: var(--gold-soft);
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: linear-gradient(180deg, rgba(92, 16, 24, 0.45) 0%, rgba(20, 4, 6, 0.75) 100%);
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(232, 201, 106, 0.12);
      padding: 22px 20px 24px;
      backdrop-filter: blur(10px);
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .modes button {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(0, 0, 0, 0.28);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 6px;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .modes button:hover {
      color: var(--cream);
      border-color: var(--gold-dim);
    }

    .modes button.active {
      background: linear-gradient(180deg, var(--maroon-mid), var(--maroon));
      color: var(--gold-soft);
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.25), 0 8px 18px rgba(92, 16, 24, 0.45);
    }

    .timer-wrap {
      position: relative;
      width: min(280px, 72vw);
      margin: 0 auto 8px;
      aspect-ratio: 1;
    }

    .timer-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 8; }
    .ring-progress {
      fill: none;
      stroke: url(#goldGrad);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s linear;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.45));
    }

    .time-readout {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.1rem, 14vw, 3.7rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--cream);
    }

    .status {
      margin-top: 10px;
      font-size: 0.92rem;
      color: var(--gold-soft);
      letter-spacing: 0.18em;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      appearance: none;
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 14px 12px;
      font: inherit;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s, box-shadow 0.15s;
    }

    .actions button:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(180deg, #e8c96a, #c9a227);
      color: #3a1408;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(201, 162, 39, 0.22);
    }

    .btn-primary:hover { filter: brightness(1.06); }

    .btn-ghost {
      background: transparent;
      color: var(--gold-soft);
      border: 1px solid var(--gold);
    }

    .btn-ghost:hover { background: rgba(212, 175, 55, 0.08); }

    .stats {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--gold-dim);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats strong {
      color: var(--gold-soft);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(196, 169, 138, 0.7);
      font-size: 0.8rem;
    }

    @media (max-width: 420px) {
      .modes button { font-size: 0.8rem; padding: 9px 4px; }
      .actions { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-progress, .modes button, .actions button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <p class="ornament">✦ · ✦ · ✦</p>
      <h1>นาฬิกาโฟกัส โพโมโดโร</h1>
      <p class="subtitle">จดจ่อ ๒๕ นาที · พักสั้น ๕ · พักยาว ๑๕</p>
    </header>

    <main class="card">
      <div class="modes" role="tablist" aria-label="โหมดจับเวลา">
        <button type="button" data-mode="focus" class="active" aria-selected="true">โฟกัส ๒๕</button>
        <button type="button" data-mode="short" aria-selected="false">พักสั้น ๕</button>
        <button type="button" data-mode="long" aria-selected="false">พักยาว ๑๕</button>
      </div>

      <div class="timer-wrap" aria-live="polite">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f3e0a0" />
              <stop offset="100%" stop-color="#c9a227" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-progress" cx="100" cy="100" r="88" />
        </svg>
        <div class="time-readout">
          <div class="time" id="time">๒๕:๐๐</div>
          <div class="status" id="status">พร้อมเริ่ม</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="toggle">เริ่ม</button>
        <button type="button" class="btn-ghost" id="reset">รีเซ็ต</button>
      </div>

      <div class="stats">
        <span>เซสชันที่ทำครบ</span>
        <strong id="count">๐</strong>
      </div>
    </main>

    <footer>เวลาที่เหลือแสดงบนแท็บเบราว์เซอร์</footer>
  </div>

  <script>
    (function () {
      const MODES = {
        focus: { seconds: 25 * 60, label: "โฟกัส", title: "โฟกัส" },
        short: { seconds: 5 * 60, label: "พักสั้น", title: "พักสั้น" },
        long: { seconds: 15 * 60, label: "พักยาว", title: "พักยาว" }
      };

      const THAI_DIGITS = "๐๑๒๓๔๕๖๗๘๙";
      const CIRCUMFERENCE = 2 * Math.PI * 88;
      const STORAGE_KEY = "pomodoro-completed";

      const timeEl = document.getElementById("time");
      const statusEl = document.getElementById("status");
      const toggleEl = document.getElementById("toggle");
      const resetEl = document.getElementById("reset");
      const countEl = document.getElementById("count");
      const ringEl = document.querySelector(".ring-progress");
      const modeButtons = document.querySelectorAll(".modes button");

      let mode = "focus";
      let remaining = MODES.focus.seconds;
      let running = false;
      let deadline = 0;
      let intervalId = 0;
      let completed = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10) || 0;

      ringEl.style.strokeDasharray = String(CIRCUMFERENCE);

      function toThaiDigits(value) {
        return String(value).replace(/\d/g, function (d) {
          return THAI_DIGITS[Number(d)];
        });
      }

      function formatClock(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const mm = String(mins).padStart(2, "0");
        const ss = String(secs).padStart(2, "0");
        return { ascii: mm + ":" + ss, thai: toThaiDigits(mm + ":" + ss) };
      }

      function setRing(left, total) {
        const progress = total === 0 ? 0 : left / total;
        ringEl.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - progress));
      }

      function render() {
        const clock = formatClock(remaining);
        timeEl.textContent = clock.thai;
        countEl.textContent = toThaiDigits(completed);
        setRing(remaining, MODES[mode].seconds);
        document.title = clock.ascii + " · " + MODES[mode].title;

        if (running) {
          statusEl.textContent = "กำลังจับเวลา";
          toggleEl.textContent = "หยุดชั่วคราว";
        } else if (remaining === 0) {
          statusEl.textContent = "ครบเวลาแล้ว";
          toggleEl.textContent = "เริ่มใหม่";
        } else if (remaining < MODES[mode].seconds) {
          statusEl.textContent = "หยุดชั่วคราว";
          toggleEl.textContent = "ทำต่อ";
        } else {
          statusEl.textContent = "พร้อมเริ่ม";
          toggleEl.textContent = "เริ่ม";
        }
      }

      function stopLoop() {
        running = false;
        deadline = 0;
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = 0;
        }
      }

      function completeSession() {
        stopLoop();
        remaining = 0;
        if (mode === "focus") {
          completed += 1;
          localStorage.setItem(STORAGE_KEY, String(completed));
        }
        render();
      }

      function tick() {
        if (!running) return;
        remaining = Math.max(0, Math.round((deadline - Date.now()) / 1000));
        if (remaining === 0) {
          completeSession();
          return;
        }
        render();
      }

      function start() {
        if (remaining === 0) remaining = MODES[mode].seconds;
        running = true;
        deadline = Date.now() + remaining * 1000;
        render();
        intervalId = setInterval(tick, 250);
      }

      function pause() {
        stopLoop();
        render();
      }

      function reset() {
        stopLoop();
        remaining = MODES[mode].seconds;
        render();
      }

      function setMode(next) {
        if (mode === next && remaining === MODES[next].seconds && !running) return;
        mode = next;
        modeButtons.forEach(function (btn) {
          const on = btn.dataset.mode === mode;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        stopLoop();
        remaining = MODES[mode].seconds;
        render();
      }

      toggleEl.addEventListener("click", function () {
        if (running) pause();
        else start();
      });

      resetEl.addEventListener("click", reset);

      modeButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setMode(btn.dataset.mode);
        });
      });

      render();
    })();
  </script>
</body>
</html>
